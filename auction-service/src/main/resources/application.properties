spring.application.name=auction-service
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties],optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:backend/.env.local[.properties]
server.port=8082
server.max-http-request-header-size=65536
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=2
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
spring.cloud.loadbalancer.cache.enabled=false
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER:https://accepted-skylark-8794.clerk.accounts.dev}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URL:https://accepted-skylark-8794.clerk.accounts.dev/.well-known/jwks.json}
bidvelocity.internal-token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}
